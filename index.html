<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification des Badges de Chantier</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- VERIFICATION CARD -->
    <div class="card">
      <h2>Vérification de Badge Chantier</h2>
      <div class="subtitle">Entrez l'ID du badge pour vérifier l'accès actif</div>

      <form id="verifyForm">
        <div class="form-group">
          <label for="checkId">ID du Badge</label>
          <input type="text" id="checkId" placeholder="ex. TC-2026-328W-B2JD" required autocomplete="off">
        </div>
        <button type="submit" id="verifyBtn">Vérifier le Badge</button>
      </form>
    </div>

    <!-- TOGGLE ADMIN PANEL -->
    <button type="button" class="admin-toggle" id="toggleAdminBtn">⚙ Afficher/Masquer la Gestion Admin</button>

    <!-- ADMIN MANAGEMENT PANEL -->
    <div class="card admin-panel" id="adminPanel">
      <h2 style="color: var(--accent-cyan);">Gérer les Badges Enregistrés</h2>
      <div class="subtitle">Ajouter, mettre à jour ou supprimer des badges (Synchronisé en direct via le Cloud)</div>

      <form id="addBadgeForm">
        <div class="form-group">
          <label for="newId">ID du Badge</label>
          <input type="text" id="newId" placeholder="ex. TC-2026-328W-B2JD" required>
        </div>
        <div class="form-group">
          <label for="newName">Nom Complet</label>
          <input type="text" id="newName" placeholder="Nom de l'ouvrier" required>
        </div>
        <div class="form-group">
          <label for="newRole">Rôle / Métier</label>
          <input type="text" id="newRole" placeholder="ex. Maçon, Électricien" required>
        </div>
        <div class="form-group">
          <label for="newStatus">Statut</label>
          <select id="newStatus">
            <option value="Active">Actif</option>
            <option value="Suspended">Suspendu</option>
          </select>
        </div>
        <button type="submit" id="saveBtn">Enregistrer dans la BDD Cloud</button>
      </form>

      <div class="badge-list" id="badgeList">
        <p style="text-align: center; color: #9ca3af; font-size: 0.85rem;">Chargement de la base de données cloud...</p>
      </div>
    </div>

  </div>

  <!-- POP-UP MODAL OVERLAY -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-card">
      <button id="closeModalBtn" class="modal-close">&times;</button>
      <div id="modalStatusBadge" class="modal-status-badge"></div>
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalDetails" class="modal-details"></div>
      <button id="modalDismissBtn" class="modal-action-btn">Fermer</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
