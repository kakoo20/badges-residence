<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Site Badge Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- VERIFICATION CARD -->
    <div class="card">
      <h2>Site Badge Check</h2>
      <div class="subtitle">Enter Badge ID to verify active access</div>

      <form id="verifyForm">
        <div class="form-group">
          <label for="checkId">Badge ID</label>
          <input type="text" id="checkId" placeholder="e.g. TC-2026-328W-B2JD" required autocomplete="off">
        </div>
        <button type="submit" id="verifyBtn">Verify Badge</button>
      </form>
    </div>

    <!-- TOGGLE ADMIN PANEL -->
    <button type="button" class="admin-toggle" id="toggleAdminBtn">⚙ Toggle Admin Management</button>

    <!-- ADMIN MANAGEMENT PANEL -->
    <div class="card admin-panel" id="adminPanel">
      <h2 style="color: var(--accent-cyan);">Manage Registered Badges</h2>
      <div class="subtitle">Add, update or remove badges (Synced Live via Cloud)</div>

      <form id="addBadgeForm">
        <div class="form-group">
          <label for="newId">Badge ID</label>
          <input type="text" id="newId" placeholder="e.g. TC-2026-328W-B2JD" required>
        </div>
        <div class="form-group">
          <label for="newName">Full Name</label>
          <input type="text" id="newName" placeholder="Worker Name" required>
        </div>
        <div class="form-group">
          <label for="newRole">Role / Trade</label>
          <input type="text" id="newRole" placeholder="e.g. Mason, Electrician" required>
        </div>
        <div class="form-group">
          <label for="newStatus">Status</label>
          <select id="newStatus">
            <option value="Active">Active</option>
            <option value="Suspended">Suspended</option>
          </select>
        </div>
        <button type="submit" id="saveBtn">Save to Cloud DB</button>
      </form>

      <div class="badge-list" id="badgeList">
        <p style="text-align: center; color: #9ca3af; font-size: 0.85rem;">Loading cloud database...</p>
      </div>
    </div>

  </div>

  <!-- POP-UP MODAL OVERLAY -->
  <div id="resultModal" class="modal-overlay">
    <div class="modal-card">
      <button id="closeModalBtn" class="modal-close">&times;</button>
      <div id="modalStatusBadge" class="modal-status-badge"></div>
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalDetails" class="modal-details"></div>
      <button id="modalDismissBtn" class="modal-action-btn">Dismiss</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
