<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Site Badge Verification</title>
  <style>
    :root {
      --bg: #121826;
      --card-bg: #1d263b;
      --accent: #f59e0b;
      --accent-blue: #3b82f6;
      --text: #f3f4f6;
      --success: #10b981;
      --error: #ef4444;
      --input-bg: #0f172a;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border-top: 5px solid var(--accent);
    }

    h2 {
      margin-top: 0;
      color: #fff;
      font-size: 1.35rem;
      text-align: center;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d1d5db;
    }

    input[type="text"], select {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid #374151;
      background-color: var(--input-bg);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Verification Results */
    .result {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: 600;
    }

    .result.valid {
      display: block;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .result.invalid {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .worker-details {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #d1d5db;
      font-weight: normal;
      text-align: left;
    }

    /* Admin Panel Styling */
    .admin-toggle {
      background: transparent;
      color: #9ca3af;
      border: 1px dashed #374151;
      font-weight: normal;
      font-size: 0.85rem;
    }

    .admin-panel {
      display: none;
      border-top-color: var(--accent-blue);
    }

    .badge-list {
      margin-top: 1rem;
      max-height: 250px;
      overflow-y: auto;
      border-top: 1px solid #374151;
      padding-top: 0.5rem;
    }

    .badge-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #2d3748;
      font-size: 0.85rem;
    }

    .badge-item .info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .badge-status-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      font-weight: bold;
    }

    .tag-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .tag-suspended { background: rgba(239, 68, 68, 0.2); color: var(--error); }

    .action-group {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .status-btn {
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      width: auto;
      border-radius: 4px;
      font-weight: bold;
    }

    .delete-btn {
      background-color: var(--error);
      color: #fff;
      padding: 0.3rem 0.6rem;
      width: auto;
      font-size: 0.75rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- VERIFICATION CARD -->
    <div class="card">
      <h2>Site Badge Check</h2>
      <div class="subtitle">Enter Badge ID to verify active access</div>

      <form id="verifyForm">
        <div class="form-group">
          <label for="checkId">Badge ID</label>
          <input type="text" id="checkId" placeholder="e.g. TC-2026-328W-B2JD" required autocomplete="off">
        </div>
        <button type="submit" id="verifyBtn">Verify Badge</button>
      </form>

      <div id="resultBox" class="result"></div>
    </div>

    <!-- TOGGLE ADMIN PANEL -->
    <button type="button" class="admin-toggle" id="toggleAdminBtn">⚙ Toggle Admin Management</button>

    <!-- ADMIN MANAGEMENT PANEL -->
    <div class="card admin-panel" id="adminPanel">
      <h2 style="color: var(--accent-blue);">Manage Registered Badges</h2>
      <div class="subtitle">Add, update or remove badges (Synced Live via Cloud)</div>

      <form id="addBadgeForm">
        <div class="form-group">
          <label for="newId">Badge ID</label>
          <input type="text" id="newId" placeholder="e.g. TC-2026-328W-B2JD" required>
        </div>
        <div class="form-group">
          <label for="newName">Full Name</label>
          <input type="text" id="newName" placeholder="Worker Name" required>
        </div>
        <div class="form-group">
          <label for="newRole">Role / Trade</label>
          <input type="text" id="newRole" placeholder="e.g. Mason, Electrician" required>
        </div>
        <div class="form-group">
          <label for="newStatus">Status</label>
          <select id="newStatus">
            <option value="Active">Active</option>
            <option value="Suspended">Suspended</option>
          </select>
        </div>
        <button type="submit" id="saveBtn" style="background-color: var(--accent-blue); color: #fff;">Save to Cloud DB</button>
      </form>

      <div class="badge-list" id="badgeList">
        <p style="text-align: center; color: #9ca3af; font-size: 0.85rem;">Loading cloud database...</p>
      </div>
    </div>

  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      deleteDoc, 
      collection, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyDjVRDGg32mwD5FD1g4fmgA0BgTJYMLwOw",
      authDomain: "badge-residence.firebaseapp.com",
      projectId: "badge-residence",
      storageBucket: "badge-residence.firebasestorage.app",
      messagingSenderId: "127189334832",
      appId: "1:127189334832:web:418ceaf8e79faad086e6f5",
      measurementId: "G-9R66KLFZYP"
    };

    // 2. INITIALIZE FIREBASE & FIRESTORE
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const badgesCollection = collection(db, "badges");

    // Helper function to sanitize IDs
    function cleanId(input) {
      return input
        .trim()
        .toUpperCase()
        .replace(/[\u2010-\u2015]/g, "-") // Normalizes special dash characters to standard hyphens
        .replace(/\s+/g, "");            // Removes hidden spaces
    }

    // UI ELEMENTS
    const verifyForm = document.getElementById('verifyForm');
    const checkIdInput = document.getElementById('checkId');
    const resultBox = document.getElementById('resultBox');
    const verifyBtn = document.getElementById('verifyBtn');

    const addBadgeForm = document.getElementById('addBadgeForm');
    const saveBtn = document.getElementById('saveBtn');
    const badgeListContainer = document.getElementById('badgeList');
    const adminPanel = document.getElementById('adminPanel');

    // AUTO-VERIFY FROM URL PARAMETER (?id=BADGE_ID)
    // AUTO-VERIFY FROM URL PARAMETERS OR PATH
window.addEventListener('DOMContentLoaded', () => {
  let badgeId = null;

  // 1. Check query parameter: ?id=TC-2026-328W-B2JD
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('id')) {
    badgeId = urlParams.get('id');
  } 

  // 2. Fallback check for path format: /idTC-2026-328W-B2JD
  if (!badgeId) {
    const path = window.location.pathname.replace('/', '');
    if (path.toLowerCase().startsWith('id')) {
      badgeId = path.substring(2); // Strips "id" from the start
    }
  }

  // Execute lookup if an ID was detected
  if (badgeId) {
    checkIdInput.value = cleanId(badgeId);
    verifyForm.dispatchEvent(new Event('submit'));
  }
});

    // VERIFY BADGE LOOKUP
    verifyForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const badgeId = cleanId(checkIdInput.value);
      if (!badgeId) return;

      verifyBtn.disabled = true;
      verifyBtn.textContent = "Checking Cloud DB...";
      resultBox.style.display = 'block';
      resultBox.className = 'result';
      resultBox.style.backgroundColor = '#1d263b';
      resultBox.style.borderColor = '#374151';
      resultBox.style.color = '#9ca3af';
      resultBox.innerHTML = `Querying record for: <strong>${badgeId}</strong>...`;

      try {
        const docRef = doc(db, "badges", badgeId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const worker = docSnap.data();
          const isActive = worker.status && worker.status.toLowerCase() === 'active';

          resultBox.className = isActive ? 'result valid' : 'result invalid';
          resultBox.innerHTML = `
            ${isActive ? '✓ LEGITIMATE BADGE' : '✕ INACTIVE / REVOKED'}
            <div class="worker-details">
              <strong>Worker:</strong> ${worker.name || 'N/A'}<br>
              <strong>Role:</strong> ${worker.role || 'N/A'}<br>
              <strong>Status:</strong> <span style="color: ${isActive ? 'var(--success)' : 'var(--error)'};">${worker.status}</span>
            </div>
          `;
        } else {
          resultBox.className = 'result invalid';
          resultBox.innerHTML = `
            ✕ UNKNOWN BADGE
            <div class="worker-details" style="text-align: center;">
              No record found for ID: <strong>${badgeId}</strong>
            </div>
          `;
        }
      } catch (err) {
        console.error("Firestore Fetch Error:", err);
        resultBox.className = 'result invalid';
        resultBox.innerHTML = `✕ ERROR: Unable to reach database. Check console logs.`;
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify Badge";
      }
    });

    // ADD / UPDATE BADGE IN FIRESTORE
    addBadgeForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const id = cleanId(document.getElementById('newId').value);
      const name = document.getElementById('newName').value.trim();
      const role = document.getElementById('newRole').value.trim();
      const status = document.getElementById('newStatus').value;

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        await setDoc(doc(db, "badges", id), {
          name: name,
          role: role,
          status: status,
          updatedAt: new Date().toISOString()
        });

        addBadgeForm.reset();
      } catch (err) {
        console.error("Error saving badge:", err);
        alert("Failed to save badge to cloud DB. Check browser console.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save to Cloud DB";
      }
    });

    // REAL-TIME SYNC FOR ADMIN LIST WITH STATUS TOGGLE
    onSnapshot(badgesCollection, (snapshot) => {
      badgeListContainer.innerHTML = '<strong style="font-size:0.8rem; color:#9ca3af; display:block; margin-bottom:0.5rem;">LIVE BADGES IN CLOUD:</strong>';

      if (snapshot.empty) {
        badgeListContainer.innerHTML += '<p style="font-size:0.85rem; color:#6b7280;">No badges found in Firestore. Add one above!</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const isActive = item.status === 'Active';

        const div = document.createElement('div');
        div.className = 'badge-item';
        div.innerHTML = `
          <div class="info">
            <div><strong>${id}</strong> - ${item.name}</div>
            <div style="color: #9ca3af; font-size: 0.75rem;">${item.role}</div>
            <span class="badge-status-tag ${isActive ? 'tag-active' : 'tag-suspended'}">${item.status}</span>
          </div>
          <div class="action-group">
            <button class="status-btn" style="background-color: ${isActive ? '#f59e0b' : '#10b981'}; color: #000;">
              ${isActive ? 'Suspend' : 'Activate'}
            </button>
            <button class="delete-btn">Delete</button>
          </div>
        `;

        // Toggle Status
        div.querySelector('.status-btn').addEventListener('click', async () => {
          const newStatus = isActive ? 'Suspended' : 'Active';
          await setDoc(doc(db, "badges", id), {
            ...item,
            status: newStatus,
            updatedAt: new Date().toISOString()
          }, { merge: true });
        });

        // Delete Document
        div.querySelector('.delete-btn').addEventListener('click', async () => {
          if (confirm(`Delete badge ${id} from cloud DB?`)) {
            await deleteDoc(doc(db, "badges", id));
          }
        });

        badgeListContainer.appendChild(div);
      });
    }, (error) => {
      console.error("Snapshot listener error:", error);
      badgeListContainer.innerHTML = '<p style="color: var(--error); font-size: 0.85rem;">Error loading live data from Cloud DB.</p>';
    });

    // ADMIN PANEL TOGGLE
    document.getElementById('toggleAdminBtn').addEventListener('click', () => {
      adminPanel.style.display = adminPanel.style.display === 'block' ? 'none' : 'block';
    });
  </script>

</body>
</html>
